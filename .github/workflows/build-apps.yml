name: Build released applications
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published engine source version
        required: true
        default: '0.1.0'
permissions:
  contents: read
concurrency:
  group: release-apps-${{ inputs.version }}
  cancel-in-progress: false
env:
  RELEASE_VERSION: ${{ inputs.version }}
  JOBS: '2'
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm-slim
    timeout-minutes: 30
    steps:
      - name: Install Debian build tools
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git python3 gcc g++ libc6-dev libsdl2-dev findutils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test source preparation and fetch verified public source
        run: |
          python3 release-tools/test_prepare_source.py
          python3 release-tools/prepare-source.py
      - name: Build with the standard algorithm header explicitly available to GCC
        run: |
          mkdir -p /usr/local/bin
          printf '#!/bin/sh\nexec /usr/bin/g++ -include algorithm "$@"\n' > /usr/local/bin/g++
          chmod +x /usr/local/bin/g++
          cd "$BUILD_SOURCE"
          ./build.sh --linux-here
      - name: Inspect package and run the Linux executable
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 release-tools/audit-apps.py "$BUILD_SOURCE"/dist/*.tar.gz
          binary="$BUILD_SOURCE/build/linux-$ARCH/dune-prime-$RELEASE_VERSION/dune-prime"
          test "$("$binary" --version)" = "$RELEASE_VERSION (build $DUNE_PRIME_BUILD_HASH)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-linux-${{ matrix.arch }}
          path: ${{ env.BUILD_SOURCE }}/dist/DunePrime-*
          if-no-files-found: error
  windows-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Windows cross compiler, installer and archive tools
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nsis p7zip-full
      - name: Fetch verified public source
        run: python3 release-tools/prepare-source.py
      - name: Build Windows application and installer
        run: |
          mkdir -p "$RUNNER_TEMP/toolchain"
          printf '#!/bin/sh\nexec /usr/bin/x86_64-w64-mingw32-g++-posix -include algorithm "$@"\n' > "$RUNNER_TEMP/toolchain/x86_64-w64-mingw32-g++"
          chmod +x "$RUNNER_TEMP/toolchain/x86_64-w64-mingw32-g++"
          export PATH="$RUNNER_TEMP/toolchain:$PATH"
          cd "$BUILD_SOURCE"
          ./build.sh windows
      - name: Inspect ZIP and extracted installer payload
        run: |
          python3 release-tools/audit-apps.py "$BUILD_SOURCE"/dist/*.zip
          mkdir -p "$RUNNER_TEMP/installer-audit"
          7z x -y "${BUILD_SOURCE}/dist/DunePrime-${RELEASE_VERSION}+${DUNE_PRIME_BUILD_HASH}-windows-x64-setup.exe" "-o$RUNNER_TEMP/installer-audit" > /dev/null
          python3 release-tools/audit-apps.py "$RUNNER_TEMP/installer-audit"
          cmp "$RUNNER_TEMP/installer-audit/dune-prime.exe" "$BUILD_SOURCE/build/windows/Dune Prime/dune-prime.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-windows-x64
          path: ${{ env.BUILD_SOURCE }}/dist/DunePrime-*
          if-no-files-found: error
  windows-run:
    needs: windows-build
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-windows-x64
          path: ${{ runner.temp }}/windows-download
      - name: Run the packaged executable on Windows
        shell: pwsh
        run: |
          $meta = Get-Content "releases/v$env:RELEASE_VERSION.json" -Raw | ConvertFrom-Json
          $hash = $meta.source.commit.Substring(0,9)
          $zip = Get-ChildItem "$env:RUNNER_TEMP/windows-download/*.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName "$env:RUNNER_TEMP/windows-app"
          $exe = "$env:RUNNER_TEMP/windows-app/Dune Prime/dune-prime.exe"
          $out = "$env:RUNNER_TEMP/version.txt"
          $err = "$env:RUNNER_TEMP/version-error.txt"
          $process = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          if ($process.ExitCode -ne 0) { throw "Windows executable failed: $($process.ExitCode)" }
          $actual = (Get-Content $out -Raw).Trim()
          $expected = "$env:RELEASE_VERSION (build $hash)"
          if ($actual -ne $expected) { throw "Unexpected version: $actual" }
          Write-Output $actual
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch verified public source
        run: python3 release-tools/prepare-source.py
      - name: Build universal macOS app and DMG
        run: cd "$BUILD_SOURCE" && ./build.sh macos
      - name: Verify app, architectures and read-only DMG contents
        run: |
          app="$BUILD_SOURCE/build/macos/Dune Prime.app"
          codesign --verify --deep --strict "$app"
          lipo "$app/Contents/MacOS/dune-prime" -verify_arch arm64 x86_64
          test "$("$app/Contents/MacOS/dune-prime" --version)" = "$RELEASE_VERSION (build $DUNE_PRIME_BUILD_HASH)"
          mount="$RUNNER_TEMP/dmg-audit"
          mkdir -p "$mount"
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$mount" "$BUILD_SOURCE"/dist/*.dmg
          trap 'hdiutil detach -quiet "$mount"' EXIT
          python3 release-tools/audit-apps.py "$mount"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-macos-universal
          path: ${{ env.BUILD_SOURCE }}/dist/DunePrime-*
          if-no-files-found: error
